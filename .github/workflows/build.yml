name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Распаковать проект из zip
        run: |
          set -e
          ZIP=$(ls *.zip | head -1)
          mkdir -p work && unzip -q "$ZIP" -d work
          ROOT=$(dirname "$(find work -name settings.gradle.kts | head -1)")
          echo "ROOT=$ROOT" >> $GITHUB_ENV
      - name: Скачать модель Vosk
        run: |
          set -e
          curl -fL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q model.zip -d mtmp
          mkdir -p "$ROOT/app/src/main/assets/model-ru"
          cp -r mtmp/*/* "$ROOT/app/src/main/assets/model-ru/"
      - name: Сборка
        run: cd "$ROOT" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: friday-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
